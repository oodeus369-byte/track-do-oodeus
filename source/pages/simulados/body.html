<main class="main">

  <!-- HEADER -->
  <div class="page-header">
    <div>
      <div class="page-title"><span class="tc-heading-icon tc-nav-icon" data-nav-icon="simulados" aria-hidden="true"></span>Simulados</div>
      <div class="page-sub" id="simSub">Acompanhe sua evolução</div>
    </div>
    <button onclick="abrirModalSimulado(null)"
      style="display:flex;align-items:center;gap:8px;padding:10px 20px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;color:#fff;font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(79,142,247,0.3)">
      ＋ Registrar simulado
    </button>
  </div>

  <!-- STATS -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px" id="simStats"></div>

  <!-- GRÁFICO DE EVOLUÇÃO -->
  <div class="sim-panels">
  <div class="sim-chart-stack">
    <div id="simChartWrap" class="sim-panel-card" style="display:none">
      <div class="sim-panel-title"><span class="sim-panel-icon" data-sim-panel-icon="line-chart" aria-hidden="true"></span>Evolução da nota</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:16px" id="simChartSub"></div>
      <div id="chartSimStage" class="sim-chart-stage">
        <canvas id="chartSim"></canvas>
      </div>
    </div>

    <div id="simMateriaChartWrap" class="sim-panel-card" style="display:none">
      <div class="sim-toolbar" style="margin-bottom:16px">
        <div>
          <div class="sim-panel-title"><span class="sim-panel-icon" data-sim-panel-icon="pie-chart-2" aria-hidden="true"></span>Raio-x por matéria</div>
          <div style="font-size:12px;color:var(--text3)" id="simMateriaChartSub"></div>
        </div>
        <div class="sim-toolbar-controls">
          <select id="simMateriaMetric" class="sim-select">
            <option value="pct">Percentual</option>
            <option value="acertos">Acertos</option>
            <option value="pontos">Pontos</option>
          </select>
        </div>
      </div>
      <div id="simMateriaChartStage" class="sim-chart-stage">
        <canvas id="chartSimMateria"></canvas>
      </div>
      <div id="simMateriaResumo" class="sim-materia-summary"></div>
    </div>
  </div>

  <!-- LISTA DE SIMULADOS -->
  <div class="sim-panel-card">
    <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:16px">Simulados registrados</div>
    <div id="listaSimulados" class="sim-list-scroll"></div>
  </div>
  </div>

</main>
